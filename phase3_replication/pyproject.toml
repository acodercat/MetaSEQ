[project]
name = "metaseq-lab"
version = "0.1.0"
description = "Experiment 2 of the MetaSEQ paper: the single agent against the MetaSEQ topology on 111 validator-graded tasks."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Pinned exactly: agents/workspace.py reads the IPython namespace through
    # one private attribute of this release (see `_user_namespace`).
    "cave-agent[all]==0.8.0",
    "pandas>=2.2.3",
    "numpy>=2.0",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "sqlalchemy>=2.0.46",
    "psycopg[binary]>=3.3.2",
    "geopandas>=1.1.4",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "requests>=2.32.5",
    "anthropic==1.11.0",
    "httpx2==2.13.1",
]

[project.scripts]
metaseq = "cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.0",
    "ruff>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Flat layout, as in AirBench: the lab's modules sit at the repository root.
packages = ["agents", "evaluation", "analysis", "domains", "tasks", "llm"]
only-include = ["agents", "evaluation", "analysis", "domains", "tasks", "llm",
                "cli.py", "settings.py", "validation.py", "errors.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
# Ported task modules are frozen copies of their source corpus; they are
# checked by `metaseq check`, not restyled.
extend-exclude = ["suites/*/tasks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

